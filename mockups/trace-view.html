<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trace view — interactive mockup</title>
  <style>
    :root { color-scheme: light; --surface: #f6f3e9; --chrome: #eeebe1; --card: #faf8f0; --text: #292b28; --muted: #666a63; --line: #d9d6cc; --edge: #aaa99e; --blue: #315f7a; --selection: #e1edf3; --external: #865413; --external-bg: #fff0d9; --preview-width: 304px; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px; background: #e0ded6; color: var(--text); font: 13px/1.45 Inter, "Segoe UI", system-ui, sans-serif; }
    button { color: inherit; font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, summary:focus-visible, [role="separator"]:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
    button { cursor: pointer; }
    button:disabled { cursor: default; opacity: .4; }
    svg.icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .app { max-width: 1600px; height: min(900px, calc(100dvh - 24px)); min-height: 560px; margin: auto; overflow: hidden; background: var(--surface); border: 1px solid #c8c6bb; border-radius: 9px; display: flex; flex-direction: column; box-shadow: 0 5px 20px #292b2810; }
    .titlebar { height: 38px; flex: none; background: var(--chrome); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; user-select: none; }
    .tab { align-self: stretch; display: flex; align-items: center; gap: 9px; padding: 0 14px; margin-top: 5px; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 7px 7px 0 0; font-weight: 600; }
    .tab .icon { color: var(--blue); }
    .window-controls { display: flex; gap: 26px; color: var(--muted); font-size: 16px; }
    .app-body { display: grid; grid-template-columns: 164px minmax(0, 1fr) var(--preview-width); min-height: 0; flex: 1; }
    .bookmarks { background: var(--chrome); border-right: 1px solid var(--line); padding: 20px 8px; }
    .bookmarks h2 { margin: 0 10px 13px; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
    .bookmark { display: flex; align-items: center; gap: 12px; padding: 11px 10px; border-radius: 5px; margin-bottom: 2px; }
    .bookmark.active { color: #244f6a; background: #dce5e8; }
    .bookmark .icon { color: var(--blue); }
    .folder-area { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .navigation { height: 46px; flex: none; display: flex; align-items: center; gap: 9px; padding: 0 15px; border-bottom: 1px solid var(--line); }
    .navigation button { width: 26px; height: 28px; border: 0; background: none; display: grid; place-items: center; padding: 0; }
    .breadcrumb { display: flex; gap: 10px; align-items: center; min-width: 0; margin-left: 7px; white-space: nowrap; }
    .breadcrumb > .icon { width: 13px; color: var(--muted); }
    .breadcrumb strong { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
    .graph-scroll { flex: 1; min-height: 0; overflow: auto; padding: 14px; scrollbar-color: #aba99f transparent; scrollbar-width: thin; }
    .component { position: relative; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 5px; background: #f8f6ed; overflow: hidden; }
    .component-heading { width: 100%; display: flex; gap: 9px; align-items: center; border: 0; background: none; padding: 9px 12px; text-align: left; min-height: 41px; }
    .component-heading:hover { background: #eeece1; }
    .component-heading .icon { width: 14px; height: 14px; color: var(--muted); }
    .component-heading img { width: 29px; height: 20px; object-fit: cover; border-radius: 2px; }
    .component-name { font-weight: 600; }
    .component-count { color: var(--muted); }
    .component-content { border-top: 1px solid #e4e0d5; overflow-x: auto; scrollbar-width: thin; }
    .component-content[hidden] { display: none; }
    .dag { position: relative; margin: 0 auto; }
    .dag-edges { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
    .dag-edges { width: 100%; height: 100%; }
    .dag-edges path { stroke: var(--edge); fill: none; stroke-width: 1.35; }
    .dag-edges path.external { stroke: #ae9066; stroke-dasharray: 4 3; }
    .dag-edges path.subfolder { stroke: #90a8b2; }
    .dag-edges path.highlight { stroke-width: 1.8; stroke: #668899; }
    .dag-edges path.unrelated { opacity: .46; }
    .dag-edges circle.junction { fill: #9c9d91; stroke: var(--surface); stroke-width: 1; }
    .dag-edges circle.junction.highlight { fill: #668899; }
    .node { position: absolute; }
    .node-card { width: 100%; display: flex; flex-direction: column; align-items: stretch; border: 1px solid #d1cfc2; background: var(--card); border-radius: 5px; padding: 5px; text-align: left; }
    .node-card:hover { border-color: #9c9e92; background: #eeede3; }
    .node-card.selected { border-color: var(--blue); background: var(--selection); box-shadow: 0 0 0 1px var(--blue); }
    .node-card img { width: 100%; height: var(--image-height); object-fit: cover; border-radius: 2px; display: block; background: var(--chrome); }
    .node.unrelated .node-card { background: #edede5; border-color: #d7d8cf; }
    .node.unrelated img { filter: grayscale(.45); opacity: .78; }
    .component.unrelated .component-heading img { filter: grayscale(.45); opacity: .78; }
    .node-label { margin-top: 4px; display: flex; align-items: center; gap: 3px; min-width: 0; }
    .node-label .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; font-size: 11px; }
    .node.large .node-label .label { font-size: 12px; }
    .node-label .icon { width: 11px; height: 11px; color: var(--muted); }
    .scope-mark { font-size: 10px; display: flex; gap: 3px; align-items: center; color: #42697a; margin-top: 3px; }
    .scope-mark .icon { width: 11px; height: 11px; }
    .scope-mark.external { color: var(--external); }
    .scope-path { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 10px; color: var(--muted); }
    .descendant-count { width: 100%; text-align: center; margin-top: 4px; font-size: 10px; color: var(--muted); }
    .unsaved-dot { display: inline-block; flex: none; width: 6px; height: 6px; border-radius: 50%; background: #a76d24; }
    .node-actions { display: none; gap: 3px; position: absolute; top: 8px; right: 8px; }
    .node:hover .node-actions, .node:focus-within .node-actions { display: flex; }
    .node-actions button { width: 25px; height: 25px; display: grid; place-items: center; border: 1px solid #d2d1c6; border-radius: 3px; background: var(--card); padding: 0; }
    .node-actions .icon { width: 13px; height: 13px; }
    .preview { min-height: 0; position: relative; border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; }
    .resize-handle { position: absolute; z-index: 10; top: 0; bottom: 0; left: -5px; width: 10px; cursor: col-resize; touch-action: none; }
    .resize-handle:hover::after, .resize-handle:focus-visible::after { content: ""; position: absolute; width: 2px; background: #7192a1; top: 0; bottom: 0; left: 4px; }
    .preview-inner { overflow-y: auto; min-height: 0; padding: 16px; scrollbar-width: thin; }
    .preview-name { display: flex; align-items: center; gap: 8px; margin-bottom: 13px; }
    .preview-name h2 { margin: 0; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .type-badge { padding: 2px 6px; font-size: 10px; border-radius: 4px; color: var(--muted); background: #e8e5db; }
    .preview-image { display: block; width: 100%; aspect-ratio: 1.58; object-fit: cover; border-radius: 3px; background: var(--chrome); }
    .file-details, .generation-details { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 6px 15px; font-size: 12px; margin: 16px 0; }
    dt { color: var(--muted); }
    dd { margin: 0; overflow-wrap: anywhere; }
    .provenance { padding-top: 14px; border-top: 1px solid var(--line); }
    .provenance h3, .inputs h4 { font-size: 12px; font-weight: 600; margin: 0 0 9px; }
    .prompt { font-size: 12px; line-height: 1.65; margin: 0; }
    .inputs { margin: 19px 0 14px; }
    .input-link { width: 100%; display: flex; align-items: center; gap: 9px; background: none; border: 0; border-radius: 4px; padding: 6px 4px; text-align: left; }
    .input-link:hover { background: #eae8dc; }
    .input-link img { width: 48px; height: 33px; object-fit: cover; border-radius: 2px; flex: none; }
    .input-description { min-width: 0; }
    .input-title { font-size: 11px; display: block; }
    .input-location { font-size: 10px; color: var(--muted); display: flex; gap: 4px; align-items: center; margin-top: 2px; min-width: 0; }
    .input-location span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .input-location .icon { width: 11px; height: 11px; }
    .input-location.external { color: var(--external); }
    .input-location.subfolder { color: #42697a; }
    details { border-top: 1px solid var(--line); padding-top: 10px; font-size: 11px; }
    summary { cursor: pointer; width: fit-content; }
    pre { overflow: auto; padding: 9px; background: var(--chrome); border-radius: 3px; font-size: 10px; line-height: 1.6; }
    .temporary-actions { display: flex; align-items: center; gap: 7px; margin-top: 9px; }
    .unsaved-badge { font-size: 10px; color: var(--external); background: var(--external-bg); border-radius: 3px; padding: 2px 6px; }
    .temporary-actions button { border: 1px solid var(--line); background: var(--card); padding: 4px 8px; border-radius: 3px; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; }
    .temporary-actions .icon { width: 12px; height: 12px; }
    .statusbar { display: flex; justify-content: space-between; gap: 12px; height: 27px; flex: none; border-top: 1px solid var(--line); padding: 5px 11px; background: var(--chrome); font-size: 10px; color: var(--muted); overflow: hidden; white-space: nowrap; }
    .statusbar [role="status"] { overflow: hidden; text-overflow: ellipsis; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
    @media (max-width: 1100px) { .app-body { grid-template-columns: 138px minmax(0,1fr) var(--preview-width); } .bookmarks { padding-left: 5px; padding-right: 5px; } }
    @media (max-width: 850px) { .app-body { grid-template-columns: minmax(0,1fr) var(--preview-width); } .bookmarks { display: none; } body { padding: 5px; } .app { height: calc(100dvh - 10px); } }
    @media (max-width: 600px) { body { padding: 0; } .app { height: 100dvh; min-height: 0; border: 0; border-radius: 0; } .app-body { display: flex; flex-direction: column; } .folder-area { flex: 1; } .preview { height: 34%; min-height: 205px; border-left: 0; border-top: 1px solid var(--line); } .preview-inner { padding: 12px; } .preview-image { width: 140px; float: left; margin: 0 14px 10px 0; } .file-details { margin-top: 0; } .provenance { clear: both; } .resize-handle { display: none; } .navigation { padding: 0 8px; gap: 3px; height: 39px; } .breadcrumb { font-size: 11px; gap: 5px; } .breadcrumb > span:first-of-type, .breadcrumb > .icon:first-of-type { display: none; } .graph-scroll { padding: 8px; } .statusbar .prototype-label { display: none; } .window-controls { gap: 18px; } }
    @media (prefers-reduced-motion: no-preference) { .node-card { transition: background-color 100ms, border-color 100ms; } }
  </style>
</head>

  <header class="titlebar"><div class="tab"><span data-icon="folder"></span>Scene edits <span aria-hidden="true" style="margin-left:26px;color:var(--muted)">×</span></div><div class="window-controls" aria-hidden="true"><span>−</span><span>□</span><span>×</span></div></header>
  <div class="app-body">

      <div class="graph-scroll" id="graphs" aria-label="Image provenance components"></div>
    </section>
    <aside class="preview" aria-label="File preview and info"><div class="resize-handle" id="previewResize" role="separator" aria-label="Resize preview pane" aria-orientation="vertical" aria-valuemin="244" aria-valuemax="440" aria-valuenow="304" tabindex="0"></div><div class="preview-inner" id="preview"></div></aside>
  </div>
  <footer class="statusbar"><span id="status" role="status" aria-live="polite"></span><span class="prototype-label">Interactive mockup · local sample images</span></footer>
</main>

const selectionContext = (nodes, selected) => {
  const byId = new Map(nodes.map(node => [node.id, node]));

  const children = new Map(nodes.map(node => [node.id, []]));
  nodes.forEach(node => node.parents.forEach(parent => children.get(parent)?.push(node.id)));
  const walk = next => {
    const seen = new Set([selected]); const pending = [selected];
    while (pending.length) for (const id of next(pending.pop())) if (!seen.has(id)) { seen.add(id); pending.push(id); }

  };

  const descendants = walk(id => children.get(id) || []);
  return {
    large: new Set([selected, ...byId.get(selected).parents, ...children.get(selected)]),
    related: new Set([...ancestors, ...descendants])

            if(name.startsWith('junction:'))return previous.junctions.get(joins.get(name.slice(9)))||fallback;
            const point=previous.nodes.get(name.slice(5));return point ? {x:point.x+point.width/2,y:source ? point.y+point.height : point.y-3} : {x:fallback.x,y:fallback.y-10};
          };
          const from=captured(path.dataset.routeFrom,true,start),to=captured(path.dataset.routeTo,false,end);
          origin=Array.from({length:25},(_,index)=>{const t=index/24,point=path.getPointAtLength(targetLength*t);return `${index?'L':'M'}${(point.x+(from.x-start.x)*(1-t)+(to.x-end.x)*t).toFixed(2)} ${(point.y+(from.y-start.y)*(1-t)+(to.y-end.y)*t).toFixed(2)}`;}).join(' ');
        }
        if(CSS.supports('d','path("M0 0 L1 1")'))motion.push(path.animate([{d:`path("${origin}")`,opacity:old?1:0},{d:`path("${samplePath(path)}")`,opacity:1}],timing));
        else motion.push(path.animate([{opacity:0},{opacity:1}],timing));
      }
    }
    const anchor=()=>{if(generation!==motionGeneration)return;keepAnchor();anchorFrame=requestAnimationFrame(anchor);};
    anchor();
    Promise.allSettled(motion.map(animation=>animation.finished)).then(()=>{if(generation===motionGeneration){cancelAnimationFrame(anchorFrame);anchorFrame=null;keepAnchor();motion=[];}});
  };
  const renderGraphs = () => {
    const before=captureScene();
    const host = document.getElementById('graphs'); const scroll = {top: host.scrollTop, left: host.scrollLeft};
    host.innerHTML = components.map(component => {
      const collapsed = state.collapsed.has(component.id); const count = component.ids.filter(id => scope(byId.get(id)) === 'current' && !state.removed.has(id)).length;
      return `<section class="component ${component.ids.includes(state.selected) ? '' : 'unrelated'}" data-component="${component.id}" aria-label="${component.title} connected component"><button class="component-heading" data-toggle-component="${component.id}" aria-expanded="${!collapsed}" aria-controls="component-${component.id}">${icon(collapsed ? 'chevron' : 'down')}<img src="${assets[byId.get(component.roots[0]).asset]}" alt=""><span class="component-name">${component.title}</span><span class="component-count">· ${count} images</span></button><div class="component-content" id="component-${component.id}" ${collapsed ? 'hidden' : ''}>${collapsed ? '' : graphMarkup(component)}</div></section>`;
    }).join('');
    host.scrollTop = scroll.top; host.scrollLeft = scroll.left;
    animateScene(before);
  };
  const inputMarkup = id => {
    const input = byId.get(id); const kind = scope(input); const marker = kind === 'current' ? 'This folder' : kind === 'subfolder' ? 'Subfolder' : 'External';
    return `<button class="input-link" data-select-input="${id}" aria-label="Preview input ${escape(input.title)}" title="${escape(input.prompt)}\n${escape(location(input))}"><img src="${assets[input.asset]}" alt=""><span class="input-description"><span class="input-title">${escape(input.title)}</span><span class="input-location ${kind}">${icon(kind === 'external' ? 'external' : kind === 'subfolder' ? 'folder' : 'file')}<span>${marker} · ${escape(location(input))}</span></span></span></button>`;
  };
  const renderPreview = () => {
    const node = byId.get(state.selected); const temporary = isTemporary(node); const source = node.parents.length === 0;
    const filename = temporary ? 'village_edit_2.png' : node.path.split('/').pop();
    const raw = {file: filename, path: temporary ? '(managed temporary output)' : node.path, prompt: node.prompt, inputs: node.parents.map(id => byId.get(id).path), ...(source ? {} : {model: 'codex', resolution: '2k', aspect_ratio: 'keep', output_size: [2048,1360], provider_metadata: {example: true}})};
    document.getElementById('preview').innerHTML = `<div class="preview-name"><h2 title="${escape(filename)}">${escape(filename)}</h2><span class="type-badge">PNG</span></div><img class="preview-image" src="${assets[node.asset]}" alt="${escape(node.title)}" draggable="false">
      ${temporary ? `<div class="temporary-actions"><span class="unsaved-badge">Unsaved</span><button data-save="${node.id}">${icon('save')}Save</button><button data-discard="${node.id}" aria-label="Discard ${escape(node.title)}">${icon('trash')}</button></div>` : ''}
      <dl class="file-details"><dt>Size</dt><dd>2.8 MB</dd><dt>Dimensions</dt><dd>2048 × 1360</dd><dt>Modified</dt><dd>Today, 14:32</dd><dt>Location</dt><dd>${temporary ? 'Temporary · not yet saved' : escape(location(node))}</dd></dl>
      <section class="provenance" aria-label="Provenance info"><h3>Provenance</h3><p class="prompt">${escape(node.prompt)}</p>${source ? '<dl class="generation-details"><dt>Source</dt><dd>Original image</dd></dl>' : '<dl class="generation-details"><dt>Model</dt><dd>Codex</dd><dt>Resolution</dt><dd>2K</dd><dt>Aspect ratio</dt><dd>Keep the same</dd></dl>'}
      ${node.parents.length ? `<div class="inputs"><h4>${node.parents.length} inputs</h4>${node.parents.map(inputMarkup).join('')}</div>` : ''}<details><summary>Raw</summary><pre>${escape(JSON.stringify(raw,null,2))}</pre></details></section>`;
  };
  const renderStatus = message => {
    const count = files.filter(node => scope(node) === 'current' && !state.removed.has(node.id)).length;
    const visible = components.filter(c => !state.collapsed.has(c.id)).reduce((sum,c) => sum + visibleIds(c).filter(id => scope(byId.get(id)) === 'current').length,0);
    document.getElementById('status').textContent = message || `${count} images · ${components.length} components · ${visible} visible · 1 selected`;
  };
  const render = (focusId = null, message = '') => {
    renderGraphs(); renderPreview(); renderStatus(message);
    if (focusId) root.querySelector(`[data-node-id="${focusId}"]`)?.focus({preventScroll: true});
  };
  const selectNode = id => {
    const node = byId.get(id); if (!node || state.removed.has(id)) return;
    state = {...state, selected: id}; render(id);
  };
  const selectInput = id => {
    const component = components.find(c => c.ids.includes(id));
    state = {...state, selected: id, collapsed: new Set([...state.collapsed].filter(c => c !== component.id))};
    render(id); root.querySelector(`[data-node-id="${id}"]`)?.scrollIntoView({block: 'nearest', inline: 'nearest'});
  };
  const saving = new Set();
  const saveImage = async id => {
    const node = byId.get(id); if (!isTemporary(node) || saving.has(id)) return;
    saving.add(id);
    try {
      const image = new Image(); image.src = assets[node.asset]; await image.decode();
      const canvas = document.createElement('canvas'); canvas.width = image.naturalWidth; canvas.height = image.naturalHeight; canvas.getContext('2d').drawImage(image,0,0);
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png')); if (!blob) throw new Error('PNG export failed');
      const url = URL.createObjectURL(blob); const anchor = document.createElement('a'); anchor.href = url; anchor.download = 'village_edit_2.png'; document.body.append(anchor); anchor.click(); anchor.remove();
      // Revoke after the browser has accepted the download, not before dispatch.
      window.addEventListener('focus', () => URL.revokeObjectURL(url), {once:true});
      state = {...state, saved: new Set([...state.saved, id])}; render(id, 'Downloaded demo PNG · output marked saved');
    } catch (error) { renderStatus(error.message); } finally { saving.delete(id); }
  };
  root.addEventListener('click', event => {
    const target = event.target.closest('button'); if (!target) return;
    if (target.dataset.save) { saveImage(target.dataset.save); return; }
    if (target.dataset.discard) {
      const id = target.dataset.discard; if (!isTemporary(byId.get(id)) || saving.has(id)) return;
      const parent = byId.get(id).parents[0]; state = {...state, removed: new Set([...state.removed,id]), selected: state.selected === id ? parent : state.selected}; render(parent, 'Temporary demo variant discarded'); return;
    }
    if (target.dataset.toggleComponent) {
      const id = target.dataset.toggleComponent; const collapsed = new Set(state.collapsed); if (collapsed.has(id)) collapsed.delete(id); else collapsed.add(id);
      state = {...state, collapsed}; renderGraphs(); renderStatus(); root.querySelector(`[data-toggle-component="${id}"]`)?.focus({preventScroll:true}); return;
    }
    if (target.dataset.selectInput) { selectInput(target.dataset.selectInput); return; }
    if (target.dataset.nodeId) selectNode(target.dataset.nodeId);
  });
  root.addEventListener('keydown', event => {
    const card = event.target.closest('[data-node-id]'); if (!card || !['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)) return;
    const id = card.dataset.nodeId; const component = components.find(c => c.ids.includes(id)); const graph = layout(component); const from = graph.points.get(id);
    const candidates = graph.ids.filter(other => other !== id).map(other => ({id: other, p: graph.points.get(other)})).filter(({p}) => event.key === 'ArrowLeft' ? p.x < from.x : event.key === 'ArrowRight' ? p.x > from.x : event.key === 'ArrowUp' ? p.y < from.y : p.y > from.y);
    candidates.sort((a,b) => {
      const score = p => event.key === 'ArrowUp' || event.key === 'ArrowDown' ? Math.abs(p.y-from.y)*3 + Math.abs(p.x-from.x) : Math.abs(p.x-from.x)*3 + Math.abs(p.y-from.y);
      return score(a.p) - score(b.p);
    });
    if (candidates.length) { event.preventDefault(); root.querySelector(`[data-node-id="${candidates[0].id}"]`)?.focus(); }
  });
  const handle = document.getElementById('previewResize');
  const setPreviewWidth = width => {
    const maximum = Math.min(440, Math.max(244, root.clientWidth - 430)); const next = Math.round(Math.min(maximum,Math.max(244,width)));
    state = {...state, previewWidth: next}; root.style.setProperty('--preview-width',next+'px'); handle.setAttribute('aria-valuenow',next); handle.setAttribute('aria-valuemax',maximum);
  };
  let drag = null;
  handle.addEventListener('pointerdown', event => { if (event.button !== 0) return; drag = {x:event.clientX,width:state.previewWidth}; handle.setPointerCapture(event.pointerId); event.preventDefault(); });
  handle.addEventListener('pointermove', event => { if (drag) setPreviewWidth(drag.width + drag.x - event.clientX); });
  const finishDrag = () => { drag = null; };
  handle.addEventListener('pointerup',finishDrag); handle.addEventListener('pointercancel',finishDrag); handle.addEventListener('lostpointercapture',finishDrag);
  handle.addEventListener('keydown', event => { if (['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) { event.preventDefault(); setPreviewWidth(event.key === 'Home' ? 244 : event.key === 'End' ? 440 : state.previewWidth + (event.key === 'ArrowLeft' ? 16 : -16)); } });
  window.addEventListener('resize', () => setPreviewWidth(state.previewWidth));
  render();
})();
</script>
