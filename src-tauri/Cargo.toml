[package]
name = "trace-explorer-backend"
version = "0.2.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/xnmp/TraceExplorer"
description = "Independent native backend for the installable TraceExplorer plugin"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.11"
base64 = "0.23"
hex = "0.4"
getrandom = "0.4"
dunce = "1"
dirs = "7"
thiserror = "2"
tempfile = "3"
libc = "0.2.183"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
ureq = { version = "3.3.0", default-features = false, features = ["rustls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = {version="0.61",features=["Win32_Foundation","Win32_Security","Win32_System_JobObjects","Win32_System_Threading","Win32_System_Diagnostics_ToolHelp"]}
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[features]
e2e-hooks = []
