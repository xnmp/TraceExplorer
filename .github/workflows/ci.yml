name: Build plugin
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: plugin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  package:
    name: Both plugins (${{ matrix.target }})
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            plugins/image-generation/backend
            crates/plugin-runtime
            crates/image-generation-contract
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - name: Provider frontend type check
        run: bunx svelte-check --tsconfig plugins/image-generation/frontend/check.tsconfig.json
      - name: Provider frontend CAS and lifetime tests
        run: bunx vitest run --config plugins/image-generation/frontend/vitest.config.ts
      - name: Package contract tests
        run: python -m unittest discover -s tests/packaging -p 'test_*.py' -v
      - name: Native Trace consumer tests
        run: cargo test --locked --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml
      - name: Native Image Generation provider tests
        run: cargo test --locked --target ${{ matrix.target }} --manifest-path plugins/image-generation/backend/Cargo.toml
      - name: Shared native runtime tests
        run: cargo test --locked --target ${{ matrix.target }} --manifest-path crates/plugin-runtime/Cargo.toml
      - name: Image service wire contract tests
        run: cargo test --locked --target ${{ matrix.target }} --manifest-path crates/image-generation-contract/Cargo.toml
      - name: Build independent native release binaries
        run: |
          cargo build --locked --release --target '${{ matrix.target }}' --manifest-path src-tauri/Cargo.toml
          cargo build --locked --release --target '${{ matrix.target }}' --manifest-path plugins/image-generation/backend/Cargo.toml
      - name: Build and package Trace then provider
        env:
          TARGET: ${{ matrix.target }}
        run: |
          suffix=''
          if [[ "$TARGET" == *windows* ]]; then suffix='.exe'; fi
          bun run build:frontend
          bun run build:image-generation:frontend
          python scripts/package-plugin.py --plugin trace --target "$TARGET" --binary "src-tauri/target/$TARGET/release/trace-explorer-backend$suffix" --output package
          python scripts/package-plugin.py --plugin image-generation --target "$TARGET" --binary "plugins/image-generation/backend/target/$TARGET/release/image-generation-backend$suffix" --output package
      - name: Rebuild in reverse order and verify exact archive identities
        env:
          TARGET: ${{ matrix.target }}
        run: |
          suffix=''
          if [[ "$TARGET" == *windows* ]]; then suffix='.exe'; fi
          bun run build:image-generation:frontend
          bun run build:frontend
          python scripts/package-plugin.py --plugin image-generation --target "$TARGET" --binary "plugins/image-generation/backend/target/$TARGET/release/image-generation-backend$suffix" --output package-reverse
          python scripts/package-plugin.py --plugin trace --target "$TARGET" --binary "src-tauri/target/$TARGET/release/trace-explorer-backend$suffix" --output package-reverse
          python tests/packaging/verify_packages.py --target "$TARGET" --packages package --compare package-reverse --trace-binary "src-tauri/target/$TARGET/release/trace-explorer-backend$suffix" --image-binary "plugins/image-generation/backend/target/$TARGET/release/image-generation-backend$suffix" > package/verification.json
          cat package/verification.json
          git diff --exit-code -- bun.lock src-tauri/Cargo.lock plugins/image-generation/backend/Cargo.lock crates/plugin-runtime/Cargo.lock crates/image-generation-contract/Cargo.lock
      - uses: actions/upload-artifact@v7
        with:
          name: SharedAI-plugins-${{ matrix.target }}
          path: package/*
          if-no-files-found: error

  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
